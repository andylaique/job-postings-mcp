<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Postings MCP · Gemini Chat</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2e3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --accent-dim: #5f8dd3;
      --user: #1e3a5f;
      --assistant: #1e2a1e;
      --error: #f28b82;
      --success: #81c995;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }
    header h1 { font-size: 1.15rem; font-weight: 500; }
    header h1 span { color: var(--accent); }
    .key-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .key-row input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      width: 280px;
      font-size: 0.85rem;
    }
    .key-row button, .send-btn {
      background: var(--accent);
      color: #0f1117;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
    }
    .key-row button:hover, .send-btn:hover { background: var(--accent-dim); }
    #status {
      font-size: 0.75rem;
      color: var(--muted);
      margin-left: 0.5rem;
    }
    #status.ok { color: var(--success); }
    #status.err { color: var(--error); }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg {
      max-width: 720px;
      padding: 0.9rem 1.1rem;
      border-radius: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border: 1px solid #2a4a7a;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant);
      border: 1px solid #2a3a2a;
    }
    .msg.tool {
      align-self: flex-start;
      background: #1a1a2e;
      border: 1px solid #3a3a5a;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .msg.system {
      align-self: center;
      color: var(--muted);
      font-size: 0.85rem;
      background: transparent;
      border: none;
    }

    footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 0.75rem;
    }
    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      resize: none;
      min-height: 48px;
      max-height: 120px;
    }
    #input:focus { outline: 1px solid var(--accent); }
    .send-btn { padding: 0.75rem 1.5rem; }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 0.5rem;
    }
    .examples button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .examples button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1>Job Postings <span>MCP</span> · Gemini</h1>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="Gemini API key (AIza…)" />
      <button id="saveKey">Save</button>
      <span id="status"></span>
    </div>
  </header>

  <main id="chat">
    <div class="msg system">
      Enter your Gemini API key above, then ask about jobs.
      Tools: search by skill · count by company · get job details · list skills
    </div>
    <div class="examples">
      <button data-q="Find remote Python jobs">Remote Python jobs</button>
      <button data-q="How many postings does each company have?">Count by company</button>
      <button data-q="What skills are most common?">List all skills</button>
      <button data-q="Show me details for job-003">Details job-003</button>
    </div>
  </main>

  <footer>
    <textarea id="input" rows="1" placeholder="Ask about job postings…"></textarea>
    <button class="send-btn" id="send">Send</button>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
